# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: acoustic-localization
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
